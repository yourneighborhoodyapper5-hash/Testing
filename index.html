<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Cloud Chat</title>

  <style>
    :root {
      --bg: #101827;
      --panel: #182235;
      --panel-2: #24324a;
      --text: #edf4ff;
      --muted: #aab8cf;
      --accent: #60a5fa;
      --user: #2563eb;
      --ai: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0b1020, #172554);
    }

    .app {
      width: min(900px, calc(100% - 24px));
      margin: 24px auto;
      background: rgba(24, 34, 53, 0.95);
      border: 1px solid #364766;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    header {
      padding: 18px;
      background: var(--panel-2);
      border-bottom: 1px solid #3a4c6d;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.3rem;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid #364766;
    }

    select,
    button,
    textarea {
      font: inherit;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #4a5d7d;
      border-radius: 8px;
      color: var(--text);
      background: #111c30;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      color: white;
      background: var(--accent);
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .secondary {
      background: #475569;
    }

    #chat {
      height: 52vh;
      min-height: 350px;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 82%;
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      background: var(--user);
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      background: var(--ai);
      border-bottom-left-radius: 3px;
    }

    .message.system {
      max-width: 100%;
      color: #ffd68a;
      background: #4a3514;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0.8;
      text-transform: uppercase;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid #364766;
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 140px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #4a5d7d;
      border-radius: 8px;
      color: var(--text);
      background: #111c30;
    }

    #status {
      padding: 0 18px 14px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .error {
      color: #fecaca !important;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        border-radius: 0;
      }

      .controls {
        flex-wrap: wrap;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>🤖 Ollama Cloud Chat</h1>
      <p>This page talks to a Cloudflare Worker, which talks to the Ollama API.</p>
    </header>

    <section class="controls">
      <select id="modelSelect">
        <option value="">Loading models...</option>
      </select>

      <button id="reloadModels" class="secondary" type="button">
        Reload models
      </button>

      <button id="clearChat" class="secondary" type="button">
        Clear chat
      </button>
    </section>

    <section id="chat" aria-live="polite"></section>

    <div id="status">Starting…</div>

    <form id="chatForm">
      <textarea
        id="messageInput"
        placeholder="Write a message..."
        required
      ></textarea>
      <button id="sendButton" type="submit">Send</button>
    </form>
  </main>

  <script>
    /*
      Replace this with your deployed Cloudflare Worker address.

      Example:
      const WORKER_URL = "https://ollama-proxy.my-name.workers.dev";
    */
    const WORKER_URL = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

    const chat = document.getElementById("chat");
    const modelSelect = document.getElementById("modelSelect");
    const messageInput = document.getElementById("messageInput");
    const chatForm = document.getElementById("chatForm");
    const sendButton = document.getElementById("sendButton");
    const statusBox = document.getElementById("status");

    const messages = [];

    function setStatus(text, isError = false) {
      statusBox.textContent = text;
      statusBox.className = isError ? "error" : "";
    }

    function addMessage(role, text) {
      const box = document.createElement("div");
      box.className = `message ${role}`;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent =
        role === "user" ? "You" :
        role === "assistant" ? "AI" : "System";

      const content = document.createElement("div");
      content.textContent = text;

      box.append(label, content);
      chat.appendChild(box);
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadModels() {
      modelSelect.innerHTML = `<option value="">Loading models...</option>`;
      setStatus("Getting available models...");

      try {
        const response = await fetch(`${WORKER_URL}/api/tags`);

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();
        const models = data.models || [];

        modelSelect.innerHTML = "";

        if (models.length === 0) {
          modelSelect.innerHTML = `<option value="">No models found</option>`;
          setStatus("No models were returned by the API.", true);
          return;
        }

        for (const model of models) {
          const option = document.createElement("option");
          option.value = model.name;
          option.textContent = model.name;
          modelSelect.appendChild(option);
        }

        setStatus(`${models.length} model(s) available.`);
      } catch (error) {
        console.error(error);
        modelSelect.innerHTML = `<option value="">Could not load models</option>`;
        setStatus(`Model error: ${error.message}`, true);
      }
    }

    async function sendChatMessage(text) {
      const model = modelSelect.value;

      if (!model) {
        setStatus("Choose a model first.", true);
        return;
      }

      messages.push({
        role: "user",
        content: text
      });

      addMessage("user", text);

      sendButton.disabled = true;
      setStatus("The AI is thinking...");

      try {
        const response = await fetch(`${WORKER_URL}/api/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model,
            messages,
            stream: false
          })
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();
        const answer = data.message?.content || "No reply was returned.";

        messages.push({
          role: "assistant",
          content: answer
        });

        addMessage("assistant", answer);
        setStatus("Ready.");
      } catch (error) {
        console.error(error);
        addMessage("system", `Request failed: ${error.message}`);
        setStatus("The request failed. Check the Worker settings.", true);
      } finally {
        sendButton.disabled = false;
      }
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = "";
      await sendChatMessage(text);
    });

    document.getElementById("reloadModels").addEventListener("click", loadModels);

    document.getElementById("clearChat").addEventListener("click", () => {
      messages.length = 0;
      chat.innerHTML = "";
      setStatus("Chat cleared.");
    });

    loadModels();
  </script>
</body>
</html>
